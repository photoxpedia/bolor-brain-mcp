[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bolor-brain-mcp"
version = "1.0.0"
description = "Cognitive reasoning architecture for AI - MCP server for Claude Code"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Bolorerdene Bundgaa", email = "your@email.com"}
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["mcp", "claude", "reasoning", "ai", "knowledge-graph", "symbolic-ai"]

dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/photoxpedia/bolor-brain-mcp"
Documentation = "https://github.com/photoxpedia/bolor-brain-mcp/tree/main/docs"
Repository = "https://github.com/photoxpedia/bolor-brain-mcp"
Issues = "https://github.com/photoxpedia/bolor-brain-mcp/issues"

[project.scripts]
bolor-brain-mcp = "mcp_server:main"

[tool.setuptools]
packages = ["modules", "modules.reasoning_engines"]

[tool.setuptools.package-data]
modules = ["*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
